[package]
name = "rust-graphql-mysql"
version = "0.1.0"
edition = "2024"

[dependencies]
async-graphql = "7.2.1"
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio", "tls-rustls"] }
#sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-native-tls", "rust_decimal", "macros", "chrono", "uuid"] }
askama = "0.14.0"
dotenvy = "0.15"
tower-http = { version = "0.6.7", features = ["cors", "limit", "fs"] } # For setting body limits
    
# Web server
axum = { version = "0.8.8", features = ["macros"] }
async-graphql-axum = "7.2.1" 
# Asynchronous runtime
tokio = { version = "1.0", features = ["full"] }
